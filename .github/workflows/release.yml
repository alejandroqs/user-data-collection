name: Generate WordPress Plugin ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate and build ZIP
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          package_dir="$build_dir/user-data-collection"
          zip_path="$GITHUB_WORKSPACE/user-data-collection.zip"
          manifest_file="$build_dir/manifest.txt"
          mkdir -p "$package_dir/includes" "$package_dir/languages"
          cp user-data-collection.php "$package_dir/"
          cp includes/*.php "$package_dir/includes/"
          cp languages/*.po languages/*.mo languages/*.pot "$package_dir/languages/"

          while IFS= read -r php_file; do php -l "$php_file" >/dev/null; done < <(find "$package_dir" -type f -name '*.php' -print)
          header_version="$(sed -n 's/^ \* Version:[[:space:]]*//p' user-data-collection.php)"
          db_version="$(sed -n "s/^define('UDC_DB_VERSION',[[:space:]]*'\([^']*\)');/\1/p" user-data-collection.php)"
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$header_version"
          test "$db_version" = "$header_version"
          test "$tag_version" = "$header_version"
          test -f "$package_dir/user-data-collection.php"
          class_files=(includes/class-udc-*.php)
          test "${#class_files[@]}" -eq 10
          for class_file in "${class_files[@]}"; do test -f "$package_dir/$class_file"; done
          executable_files="$(find "$package_dir" -type f -perm /111 -print)"
          test -z "$executable_files"
          (cd "$build_dir" && zip -qr "$zip_path" user-data-collection)
          unzip -Z1 "$zip_path" > "$manifest_file"

          manifest_contains() {
            local expected="$1"
            local entry
            while IFS= read -r entry; do
              if [[ "$entry" == "$expected" ]]; then
                return 0
              fi
            done < "$manifest_file"
            return 1
          }

          while IFS= read -r entry; do
            case "$entry" in
              user-data-collection/|user-data-collection/includes/|user-data-collection/languages/|user-data-collection/user-data-collection.php)
                ;;
              user-data-collection/includes/*.php)
                relative="${entry#user-data-collection/includes/}"
                if [[ -z "$relative" || "$relative" == */* ]]; then exit 1; fi
                ;;
              user-data-collection/languages/*.po|user-data-collection/languages/*.mo|user-data-collection/languages/*.pot)
                relative="${entry#user-data-collection/languages/}"
                if [[ -z "$relative" || "$relative" == */* ]]; then exit 1; fi
                ;;
              *)
                exit 1
                ;;
            esac
          done < "$manifest_file"

          manifest_contains 'user-data-collection/'
          manifest_contains 'user-data-collection/includes/'
          manifest_contains 'user-data-collection/languages/'
          manifest_contains 'user-data-collection/user-data-collection.php'
          for class_file in "${class_files[@]}"; do manifest_contains "user-data-collection/$class_file"; done

      - name: Create GitHub release and upload ZIP
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: user-data-collection.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
