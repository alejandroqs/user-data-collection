name: Generate WordPress Plugin ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install locked PDF dependencies and build tools
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          composer --working-dir=tools/pdf-build install --no-dev --no-interaction --prefer-dist --no-progress
          composer audit --locked --no-dev
          php scripts/build-pdf-runtime.php

      - name: Validate documents and build ZIP
        run: |
          python3 -m pip install -r tests/requirements-pdf.txt
          php tests/forms-review.php
          python3 tests/pdf-documents.py
          python3 scripts/build-package.py --tag "$GITHUB_REF_NAME" --output "$GITHUB_WORKSPACE/user-data-collection.zip"

      - name: Create GitHub release and upload ZIP
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: user-data-collection.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
